# Build the Jupyter Book in docs/ and deploy it to GitHub Pages.
# Requires Settings -> Pages -> Source: "GitHub Actions".

name: Docs
on:
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'The tag or commit to build docs from'
        required: true
        default: 'main'
        type: string

env:
  # `BASE_URL` determines the website is served from, including CSS & JS assets
  BASE_URL: /${{ github.event.repository.name }}

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write
# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: 'pages'
  cancel-in-progress: false
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name }}
          fetch-depth: 0 # setuptools_scm needs the tags
          submodules: recursive

      - name: Setup Pages
        uses: actions/configure-pages@v5

      # Jupyter Book 2 runs on Node
      - uses: actions/setup-node@v4
        with:
          node-version: 20.x

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install package and Jupyter Book
        run: |
          pip install --upgrade pip
          pip install meson-python ninja meson pybind11 setuptools_scm
          pip install .[test]
          pip install "jupyter-book>=2" ipykernel matplotlib

      - name: Build HTML
        run: |
          cd docs
          jupyter-book build --html --execute

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: 'docs/_build/html'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
